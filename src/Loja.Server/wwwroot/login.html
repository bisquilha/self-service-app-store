<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Loja de Aplicativos</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --text:#1c2433; --muted:#5b6578; --accent:#1f5fd6; --border:#d5dbe6; --danger:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1520; --card:#18202e; --text:#e8ecf4; --muted:#9aa5b8; --accent:#6ea0ff; --border:#2a3446; --danger:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; padding:16px; }
  main { width:100%; max-width:360px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:13px; }
  label { display:block; font-weight:600; font-size:13px; margin:14px 0 6px; }
  input { width:100%; padding:10px 12px; font:inherit; color:var(--text); background:transparent; border:1px solid var(--border); border-radius:8px; }
  input:focus-visible { outline:3px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color:var(--accent); }
  button { width:100%; margin-top:20px; padding:11px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  button[disabled] { opacity:.6; cursor:default; }
  #erro { min-height:20px; margin-top:12px; color:var(--danger); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Loja de Aplicativos</h1>
  <p class="sub">Entre com o usuário e a senha da loja.</p>
  <form id="f">
    <label for="u">Usuário</label>
    <input id="u" name="username" autocomplete="username" required autofocus>
    <label for="p">Senha</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <div id="erro" role="alert" aria-live="polite"></div>
    <button id="b" type="submit">Entrar</button>
  </form>
</main>
<script>
  const params = new URLSearchParams(location.search);
  let back = params.get('return') || '/admin/';
  // só volta para endereços do próprio servidor
  if (!back.startsWith('/') || back.startsWith('//')) back = '/admin/';
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const b = document.getElementById('b'), erro = document.getElementById('erro');
    b.disabled = true; erro.textContent = '';
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'loja-admin' },
        body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }),
        credentials: 'same-origin',
      });
      if (r.ok) { location.href = back; return; }
      let msg = 'Não foi possível entrar.';
      try { msg = (await r.json()).message || msg; } catch {}
      erro.textContent = msg;
    } catch { erro.textContent = 'Não foi possível falar com o servidor.'; }
    b.disabled = false;
  });
</script>
</body>
</html>
